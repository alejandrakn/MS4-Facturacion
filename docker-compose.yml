services:
  ms4-api:
    build: .
    container_name: ms4-api
    restart: unless-stopped
    environment:
      # host.docker.internal permite que el contenedor de MS4 llegue a MS1 y
      # MS2, que corren en otros docker-compose (otras redes docker) pero
      # exponen sus puertos al host (8000 y 8082). Funciona directo en
      # Windows y Mac. En Linux revisar el README si no conecta.
      PORT: 8083
      PUBLIC_API_URL: http://localhost:8083
      MS1_BASE_URL: http://host.docker.internal:8000
      MS2_BASE_URL: http://host.docker.internal:8082
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
